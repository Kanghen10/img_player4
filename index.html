<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCTV Player</title>

<style>

html,body{
margin:0;
padding:0;
background:black;
height:100%;
overflow:hidden;
}

#frame{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;
border:none;
}

</style>

</head>

<body>

<iframe id="frame"></iframe>

<script>

const hash = window.location.hash.substring(1);

function fullscreen(){

const elem=document.documentElement;

if(elem.requestFullscreen){
elem.requestFullscreen();
}
else if(elem.webkitRequestFullscreen){
elem.webkitRequestFullscreen();
}

}

if(!hash){

document.body.innerHTML="<div style='color:white;text-align:center;margin-top:40vh;font-family:sans-serif'>URL stream tidak ditemukan</div>";

}else{

const id = hash.split("/").pop();

const url = "https://cctv.banyuasinkab.go.id/#/stream/"+id;

document.getElementById("frame").src = "https://cctv.banyuasinkab.go.id";

setTimeout(fullscreen,500);

}

</script>

</body>
</html>
